<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mini Cripta 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
Mini RPG
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  --bg: #e6e0ef;
  --fg: #241c33;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #07050d; --fg: #efe8ff; }
}
:root[data-theme="dark"] { --bg: #07050d; --fg: #efe8ff; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--fg);
  font-family: "Pixelify Sans", ui-monospace, "Courier New", monospace;
  overflow: hidden; touch-action: none;
  user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
}
button { font: inherit; color: inherit; }
#stage { position: relative; width: 100%; height: 100%; overflow: hidden; background: #0a0712; color: #efe8ff; }
#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#fx { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.fl { position: absolute; transform: translate(-50%, -50%); font-weight: 600; font-size: 15px; text-shadow: 0 2px 0 rgba(0,0,0,.75), 0 0 6px rgba(0,0,0,.6); white-space: nowrap; }
.fl.big { font-size: 22px; }
#hurt { position: absolute; inset: 0; pointer-events: none; opacity: 0; background: radial-gradient(ellipse at center, rgba(255,40,90,0) 45%, rgba(255,30,80,.55) 100%); }

/* HUD */
#hud { position: absolute; left: 0; right: 0; top: 0; display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; padding: 8px; pointer-events: none; }
.pb { background: rgba(12, 8, 22, .64); border: 1px solid rgba(190, 170, 240, .22); border-radius: 8px; padding: 6px 8px; }
#hudL { width: min(46vw, 250px); }
#who { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; margin-bottom: 4px; }
#who span:last-child { color: #ffd28a; }
.bar { position: relative; height: 15px; background: #2a1a30; border-radius: 4px; overflow: hidden; }
.bar i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: linear-gradient(#ff6b8a, #c9264f); }
.bar b { position: absolute; inset: 0; font-weight: 400; font-size: 11px; line-height: 15px; text-align: center; text-shadow: 0 1px 0 #000; }
.bar.xp { height: 7px; margin-top: 4px; background: #1c1830; }
.bar.xp i { background: linear-gradient(#a8c4ff, #5b6cf0); }
#hudM { display: flex; gap: 12px; font-size: 14px; align-items: center; padding: 5px 10px; }
#hudM .c { color: #ffd28a; }
#hudM .f { color: #cfc4e6; }
#hudR { display: flex; gap: 6px; align-items: flex-start; }
#mm { display: block; width: 60px; height: 60px; image-rendering: pixelated; }
#hudBtns { display: flex; flex-direction: column; gap: 4px; pointer-events: auto; }
.hb { position: relative; min-width: 40px; height: 28px; padding: 0 8px; border-radius: 6px; cursor: pointer; background: rgba(12, 8, 22, .72); border: 1px solid rgba(190, 170, 240, .35); font-size: 12px; }
.hb:active { background: rgba(60, 40, 100, .8); }
.hb:focus-visible { outline: 2px solid #ffd28a; }
.hb em { position: absolute; top: -6px; right: -6px; min-width: 16px; height: 16px; border-radius: 8px; background: #ff5f8a; color: #1a0b12; font-style: normal; font-size: 10px; line-height: 16px; text-align: center; display: none; }
#bossBar { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); width: min(60vw, 420px); display: none; text-align: center; font-size: 13px; color: #ffb3c4; pointer-events: none; }
#bossBar .bar { height: 12px; margin-top: 3px; background: #3a1020; }
#bossBar .bar i { background: linear-gradient(#ff6b8a, #be123c); }
#skillbar { position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); display: flex; gap: 8px; pointer-events: none; }
body.boss #skillbar { bottom: 52px; }
.chip { position: relative; overflow: hidden; padding: 4px 10px; border-radius: 6px; font-size: 12px; background: rgba(12, 8, 22, .7); border: 1px solid rgba(190, 170, 240, .3); }
.chip i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: rgba(120, 90, 200, .45); }
.chip span { position: relative; }
.is-touch #skillbar { display: none; }
#toast { position: absolute; left: 50%; top: 84px; transform: translateX(-50%); max-width: 90%; padding: 6px 12px; border-radius: 8px; background: rgba(12, 8, 22, .85); border: 1px solid rgba(190,170,240,.3); font-size: 13px; text-align: center; opacity: 0; transition: opacity .2s; pointer-events: none; }
#toast.show { opacity: 1; }
#hint { position: absolute; left: 50%; top: 122px; transform: translateX(-50%); max-width: 92%; text-align: center; font-size: 12px; color: rgba(220, 210, 245, .75); text-shadow: 0 1px 0 #000; pointer-events: none; transition: opacity 1s; }
#tip { position: absolute; left: 50%; top: 84px; transform: translateX(-50%); min-width: 190px; max-width: 86%; padding: 8px 12px; border-radius: 8px; background: rgba(10, 6, 20, .92); border: 2px solid var(--rc, #888); font-size: 12px; display: none; pointer-events: none; }
#tip h4 { margin: 0 0 2px; font-size: 14px; font-weight: 600; color: var(--rc, #fff); }
#tip small { color: #9a8fb3; display: block; margin-bottom: 4px; }
#tip ul { list-style: none; margin: 0; padding: 0; }
#tip li { color: #cfe8d0; }
#tip .pr { margin-top: 4px; color: #ffd28a; }

/* Overlay e pannelli */
#overlay { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(7, 4, 14, .9); z-index: 20; padding: 8px; }
#overlay.show { display: flex; }
#overlay .panel { display: none; flex-direction: column; align-items: center; gap: 12px; max-height: 100%; width: 100%; max-width: 980px; }
#overlay[data-view="class"] #pClass, #overlay[data-view="level"] #pLevel, #overlay[data-view="inv"] #pInv, #overlay[data-view="msg"] #pMsg { display: flex; }
.scroll { overflow: auto; touch-action: pan-y; -webkit-overflow-scrolling: touch; }
h1.t { margin: 0; font-weight: 600; font-size: clamp(30px, 8vw, 54px); letter-spacing: .04em; line-height: 1; color: #ffd28a; text-shadow: 0 4px 0 #7a1f3d, 0 8px 0 rgba(0,0,0,.45); text-align: center; }
.sub { margin: 0; color: #cfc4e6; text-align: center; max-width: 36em; line-height: 1.35; font-size: 14px; }
.rec { color: #9a8fb3; font-size: 13px; }
.cards { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; width: 100%; }
.card { flex: 1 1 200px; max-width: 290px; text-align: left; cursor: pointer; padding: 12px; border-radius: 10px; background: #17112a; border: 2px solid var(--cc, #4b3d66); display: flex; flex-direction: column; gap: 5px; font-size: 13px; line-height: 1.3; }
.card:hover, .card:focus-visible { background: #221a3c; outline: none; transform: translateY(-2px); }
.card h3 { margin: 0; font-size: 20px; font-weight: 600; color: var(--cc, #fff); }
.card .role { color: #9a8fb3; }
.card dl { margin: 2px 0; display: grid; grid-template-columns: auto 1fr; gap: 1px 10px; }
.card dt { color: #9a8fb3; }
.card dd { margin: 0; color: #efe8ff; text-align: right; }
.card p { margin: 0; color: #cfc4e6; }
.card p b { color: #ffd28a; font-weight: 600; }
.card .cat { font-size: 11px; color: var(--cc); }
.mstats { display: grid; grid-template-columns: auto auto; gap: 3px 22px; font-size: 14px; }
.mstats span:nth-child(even) { color: #ffd28a; text-align: right; }
.btn { font-weight: 600; padding: 9px 22px; border: 0; border-radius: 7px; background: #ff5f8a; color: #1a0b12; box-shadow: 0 4px 0 #8f2447; cursor: pointer; font-size: 15px; }
.btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #8f2447; }
.btn.alt { background: #3a2d5c; color: #efe8ff; box-shadow: 0 4px 0 #1e1634; }
.btn.sm { padding: 6px 12px; font-size: 13px; }
.btn:focus-visible { outline: 3px solid #ffd28a; outline-offset: 2px; }
.btns { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }

/* Inventario */
#pInv { align-items: stretch; gap: 8px; }
#pInv header { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
#pInv header h2 { margin: 0; font-size: 20px; font-weight: 600; color: #ffd28a; }
.invbody { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-start; }
.invcol { flex: 1 1 250px; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
.slots { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.slot { text-align: left; padding: 6px 8px; border-radius: 8px; background: #17112a; border: 2px solid var(--rc, #4b3d66); cursor: pointer; display: grid; grid-template-columns: 26px 1fr; grid-template-rows: auto auto; column-gap: 6px; align-items: center; min-height: 46px; }
.slot svg { grid-row: 1 / 3; width: 24px; height: 24px; fill: var(--rc, #7d6fa0); }
.slot span { font-size: 11px; color: #9a8fb3; }
.slot em { font-style: normal; font-size: 12px; color: var(--rc, #efe8ff); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.slot.empty em { color: #6b5f80; }
.slot.sel, .it.sel { box-shadow: 0 0 0 2px #ffd28a; }
.bag { display: grid; grid-template-columns: repeat(auto-fill, minmax(50px, 1fr)); gap: 6px; }
.it { position: relative; aspect-ratio: 1; border-radius: 8px; background: #17112a; border: 2px solid var(--rc, #4b3d66); cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0; }
.it svg { width: 60%; height: 60%; fill: var(--rc, #fff); }
.it small { position: absolute; right: 3px; bottom: 1px; font-size: 10px; color: #cfc4e6; }
.it u { position: absolute; left: 3px; top: 3px; width: 8px; height: 8px; border-radius: 50%; background: #5ee08a; }
.it.empty { background: transparent; border-style: dashed; border-color: #2d2548; cursor: default; }
.box { background: #120d22; border: 1px solid #2d2548; border-radius: 8px; padding: 8px 10px; font-size: 13px; line-height: 1.35; }
.box h4 { margin: 0 0 3px; font-size: 16px; font-weight: 600; color: var(--rc, #fff); }
.box small { color: #9a8fb3; display: block; margin-bottom: 4px; }
.box ul { list-style: none; margin: 0 0 6px; padding: 0; }
.box li { display: flex; justify-content: space-between; gap: 8px; color: #cfe8d0; }
.box li.neg { color: #ff8fa8; }
.box li i { font-style: normal; font-size: 12px; }
.up { color: #5ee08a; } .dn { color: #ff8fa8; }
.sgrid { display: grid; grid-template-columns: 1fr auto; gap: 1px 12px; }
.sgrid span:nth-child(even) { color: #ffd28a; text-align: right; }

/* Controlli touch */
#touch { position: fixed; inset: 0; display: none; pointer-events: none; z-index: 10; }
.is-touch #touch { display: block; }
#stick { position: absolute; left: calc(18px + env(safe-area-inset-left, 0px)); bottom: calc(24px + env(safe-area-inset-bottom, 0px)); width: 132px; height: 132px; border-radius: 50%; background: rgba(150,130,200,.16); border: 2px solid rgba(190,170,240,.35); pointer-events: auto; touch-action: none; display: flex; align-items: center; justify-content: center; }
#knob { width: 54px; height: 54px; border-radius: 50%; background: rgba(220,205,255,.5); border: 2px solid rgba(255,255,255,.55); pointer-events: none; }
.tb { position: absolute; display: flex; align-items: center; justify-content: center; border-radius: 50%; overflow: hidden; font-weight: 600; font-size: 12px; color: #fff; pointer-events: auto; touch-action: none; background: rgba(255,95,138,.28); border: 2px solid rgba(255,140,170,.6); text-align: center; line-height: 1.1; }
.tb.on { background: rgba(255,95,138,.6); }
.tb span { position: relative; pointer-events: none; }
.tb::after { content: ""; position: absolute; inset: 0; border-radius: 50%; background: conic-gradient(rgba(0,0,0,.6) calc(var(--cd, 0) * 360deg), transparent 0); pointer-events: none; }
#btnA { width: 92px; height: 92px; right: calc(20px + env(safe-area-inset-right, 0px)); bottom: calc(34px + env(safe-area-inset-bottom, 0px)); }
#btnS { width: 70px; height: 70px; right: calc(124px + env(safe-area-inset-right, 0px)); bottom: calc(26px + env(safe-area-inset-bottom, 0px)); background: rgba(255,200,90,.22); border-color: rgba(255,210,120,.6); }
#btnD { width: 58px; height: 58px; right: calc(34px + env(safe-area-inset-right, 0px)); bottom: calc(138px + env(safe-area-inset-bottom, 0px)); background: rgba(94,234,212,.2); border-color: rgba(94,234,212,.55); }
@media (prefers-reduced-motion: reduce) { .card:hover { transform: none; } .btn:active { transform: none; } }
</style>
</head>
<body>
<div id="stage">
  <canvas id="gl" aria-label="Mini Cripta 3D, gioco roguelike"></canvas>
  <div id="fx"></div>
  <div id="hurt"></div>
  <div id="hud">
    <div id="hudL" class="pb">
      <div id="who"><span id="whoN"></span><span id="whoL"></span></div>
      <div class="bar"><i id="hpFill"></i><b id="hpTxt"></b></div>
      <div class="bar xp"><i id="xpFill"></i></div>
    </div>
    <div id="hudM" class="pb"><span class="c" id="coinTxt">0</span><span class="f" id="floorTxt"></span></div>
    <div id="hudR">
      <canvas id="mm" width="60" height="60" class="pb" style="padding:0"></canvas>
      <div id="hudBtns">
        <button class="hb" id="bInv" type="button">Zaino<em id="invBadge"></em></button>
        <button class="hb" id="bPause" type="button">Pausa</button>
        <button class="hb" id="bSnd" type="button">Suono</button>
      </div>
    </div>
  </div>
  <div id="bossBar"><span id="bossName"></span><div class="bar"><i id="bossFill"></i></div></div>
  <div id="skillbar">
    <div class="chip" id="chipS"><i></i><span id="chipSt"></span></div>
    <div class="chip" id="chipD"><i></i><span>Scatto (Shift)</span></div>
    <div class="chip"><span>Zaino (I)</span></div>
  </div>
  <div id="toast"></div>
  <div id="hint"></div>
  <div id="tip"></div>

  <div id="overlay" data-view="class" class="show">
    <div class="panel" id="pClass">
      <h1 class="t">MINI CRIPTA 3D</h1>
      <p class="sub">Scendi nella cripta, ripulisci le stanze, raccogli equipaggiamento e potenziati a ogni livello. Scegli la tua classe.</p>
      <div class="cards" id="classCards"></div>
      <div class="rec" id="recTxt"></div>
    </div>
    <div class="panel" id="pLevel">
      <h1 class="t" style="font-size:clamp(26px,7vw,44px)">LIVELLO <span id="lvNum"></span></h1>
      <p class="sub">Scegli un potenziamento.</p>
      <div class="cards" id="lvCards"></div>
    </div>
    <div class="panel scroll" id="pInv"></div>
    <div class="panel" id="pMsg">
      <h1 class="t" id="mTitle"></h1>
      <p class="sub" id="mText"></p>
      <div class="mstats" id="mStats"></div>
      <div class="btns" id="mBtns"></div>
    </div>
  </div>
</div>
<div id="touch">
  <div id="stick"><div id="knob"></div></div>
  <div id="btnD" class="tb" role="button" aria-label="Scatto"><span>SCATTO</span></div>
  <div id="btnS" class="tb" role="button" aria-label="Abilità"><span id="btnSt">ABILITÀ</span></div>
  <div id="btnA" class="tb" role="button" aria-label="Attacco"><span>ATTACCO</span></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const overlay = $('overlay');
function setView(v) { overlay.dataset.view = v; overlay.classList.toggle('show', v !== 'none'); }
if (typeof THREE === 'undefined') {
  $('mTitle').textContent = 'Grafica non caricata';
  $('mText').textContent = 'Non riesco a caricare la libreria 3D. Controlla la connessione e ricarica la pagina.';
  setView('msg'); return;
}

/* =====================================================================
   1. CONFIGURAZIONE E DATI
   ===================================================================== */
const T = 2, RW = 15, RH = 10, W = RW * T, H = RH * T;       // tile = 2 unita mondo
const DOOR_X = 7, DOOR_Y = 4;
const DCX = DOOR_X * T + T / 2, DCY = DOOR_Y * T + T / 2;    // centro porte
const isTouch = matchMedia('(pointer: coarse)').matches;
if (isTouch) document.documentElement.classList.add('is-touch');

const rnd = (a, b) => a + Math.random() * (b - a);
const irnd = (a, b) => Math.floor(rnd(a, b + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const hyp = Math.hypot;
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const n1 = v => (Math.round(v * 10) / 10).toString().replace('.', ',');
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* storage non disponibile */ } }
};
let best = store.get('mc3d_best', { floor: 0, level: 0 });
let muted = store.get('mc3d_muted', false);

const THEMES = [
  { name: 'La Cripta', a: '#2a2240', b: '#30274a', wall: 0x4a3c6c, top: 0x6a5a98, rock: 0x5a5072, fog: 0x0d0916, amb: 0x8a78c8, torch: 0xffa860, deco: 0xb36bff },
  { name: 'Catacombe di muschio', a: '#1f2e2a', b: '#243630', wall: 0x3c5a4e, top: 0x58806e, rock: 0x4e6a5c, fog: 0x07110d, amb: 0x7ab8a0, torch: 0xb8ff7a, deco: 0x6aff9a },
  { name: 'La Forgia', a: '#34201f', b: '#3d2523', wall: 0x65382c, top: 0x8c4c3a, rock: 0x6a4a40, fog: 0x150807, amb: 0xc89080, torch: 0xff6a2a, deco: 0xff7a3a },
  { name: 'La Ghiacciaia', a: '#223244', b: '#283a50', wall: 0x42628a, top: 0x6a94c0, rock: 0x587a9c, fog: 0x07111b, amb: 0x90b8e8, torch: 0x8fe8ff, deco: 0x8fe8ff }
];

const SLOTS = ['weapon', 'armor', 'helm', 'ring'];
const SLOT_NAME = { weapon: 'Arma', armor: 'Armatura', helm: 'Elmo', ring: 'Anello' };
const RAR = [
  { n: 'Comune', col: '#b8b0c8', hex: 0xb8b0c8, aff: 0, mult: 1.0 },
  { n: 'Non comune', col: '#5ee08a', hex: 0x5ee08a, aff: 1, mult: 1.2 },
  { n: 'Raro', col: '#58a6ff', hex: 0x58a6ff, aff: 2, mult: 1.45 },
  { n: 'Epico', col: '#b36bff', hex: 0xb36bff, aff: 3, mult: 1.75 },
  { n: 'Leggendario', col: '#ffa53a', hex: 0xffa53a, aff: 4, mult: 2.1 }
];
const STAT = {
  dmg: { l: 'Danno', u: '' }, dmgP: { l: 'Danno', u: '%' }, aspd: { l: 'Vel. attacco', u: '%' },
  crit: { l: 'Critico', u: '%' }, critD: { l: 'Danno critico', u: '%' }, hp: { l: 'Vita', u: '' },
  armor: { l: 'Armatura', u: '' }, move: { l: 'Velocità', u: '%' }, steal: { l: 'Vampirismo', u: '%', d: 1 },
  regen: { l: 'Rigenerazione', u: '/s', d: 1 }, cdr: { l: 'Ricarica abilità', u: '%' },
  xp: { l: 'Esperienza', u: '%' }, luck: { l: 'Fortuna', u: '%' }
};
const AFFIX = {
  dmg: { b: 1.6, s: .9 }, dmgP: { b: 3, s: 1.3 }, aspd: { b: 3, s: 1 }, crit: { b: 2, s: .7 }, critD: { b: 8, s: 2.6 },
  hp: { b: 9, s: 4.5 }, armor: { b: 2, s: 1.1 }, move: { b: 2, s: .5 }, steal: { b: .8, s: .22 }, regen: { b: .25, s: .1 },
  cdr: { b: 3, s: .8 }, xp: { b: 4, s: 1.4 }, luck: { b: 4, s: 1.1 }
};
const POOL = {
  weapon: ['dmg', 'dmgP', 'aspd', 'crit', 'critD', 'steal'],
  armor: ['hp', 'armor', 'regen', 'move', 'cdr', 'xp'],
  helm: ['hp', 'armor', 'xp', 'luck', 'cdr', 'crit'],
  ring: ['dmgP', 'aspd', 'crit', 'critD', 'steal', 'regen', 'cdr', 'xp', 'luck', 'move', 'hp']
};
const SUFFIX = {
  dmg: 'della Furia', dmgP: 'del Carnefice', aspd: 'della Tempesta', crit: 'del Cacciatore', critD: 'del Boia',
  hp: 'della Quercia', armor: 'del Bastione', move: 'del Vento', steal: 'del Vampiro', regen: 'della Fenice',
  cdr: 'dell’Arcano', xp: 'del Sapiente', luck: 'della Fortuna'
};
const LEGEND = ['dell’Abisso', 'del Re Spettro', 'dell’Ultimo Guardiano', 'della Cripta Eterna'];
const BASE_NAME = {
  armor: ['Corazza', 'Cotta', 'Veste'], helm: ['Elmo', 'Cappuccio', 'Corona'], ring: ['Anello', 'Fascia', 'Sigillo']
};
const SCORE_W = { dmg: 3, dmgP: 2, aspd: 1.8, crit: 1.5, critD: .5, hp: .35, armor: 1.4, move: 1, steal: 3, regen: 4, cdr: 1, xp: .6, luck: .6 };

    floatText(P.x, 3.2, P.y, 'LIVELLO ' + P.level + '!', '#a8c4ff', true);
  }
}
let lvChoices = [];
function openLevelUp() {

}
function pickUpgrade(i) {

/* ---- attacchi del giocatore ---- */
function computeAim() {
  const P = G.P, m = input.mouse;
  let dx, dy;
  if (!isTouch && (m.down || performance.now() - m.t < 2500)) {
    ndc.set(m.nx, m.ny); ray.setFromCamera(ndc, camera);
    if (ray.ray.intersectPlane(aimPlane, aimPt)) { dx = aimPt.x - P.x; dy = aimPt.z - P.y; }
  }
  if (dx === undefined) {
    let bst = null, bd = 1e9;
    for (const e of G.cur.enemies) { if (e.dead || e.spawnT > 0) continue; const d = hyp(e.x - P.x, e.y - P.y); if (d < bd) { bd = d; bst = e; } }
    if (bst) { dx = bst.x - P.x; dy = bst.y - P.y; } else { dx = P.fx; dy = P.fy; }
  }
  const l = hyp(dx, dy); if (l > .001) { P.ax = dx / l; P.ay = dy / l; }
}
function playerAttack() {
  const P = G.P, S = P.S, cls = P.cls;
  P.cd = S.delay; P.atkAnim = .22; P.faceT = .35;
  if (cls === 'warrior') {
    const reach = 3.6 * S.reach, half = (78 + S.arc / 2) * Math.PI / 180;
    for (const e of G.cur.enemies) {
      if (e.dead || e.spawnT > 0) continue;
      const dx = e.x - P.x, dy = e.y - P.y, d = hyp(dx, dy);
      if (d > reach + e.r) continue;
      const dot = (dx * P.ax + dy * P.ay) / (d || 1);
      if (d < e.r + .9 || Math.acos(clamp(dot, -1, 1)) < half) dealDamage(e, S.dmg, dx, dy, 9);
    }
    const gr = new THREE.Group(); gr.position.set(P.x, .12, P.y); gr.rotation.y = Math.atan2(P.ax, P.ay);
    const geo = new THREE.RingGeometry(.45, 1, 20, 1, -Math.PI / 2 - half, half * 2);
    const sl = new THREE.Mesh(geo, bmat(0xffe9b0, .75, true)); sl.rotation.x = -Math.PI / 2; sl.scale.set(reach, reach, reach); gr.add(sl); fxGroup.add(gr);
    fxRings.push({ m: gr, r: 1, t: 0, dur: .16, slash: true, geo });
    sfx.swing();
  } else {
    const n = S.proj, spread = .15, base = Math.atan2(P.ay, P.ax);
    for (let i = 0; i < n; i++) {
      const a = base + (i - (n - 1) / 2) * spread;
      const sp = cls === 'mage' ? 20 : 26;
      addBullet({ x: P.x + Math.cos(a) * .9, y: P.y + Math.sin(a) * .9, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, r: cls === 'mage' ? .34 : .22, dmg: S.dmg, life: cls === 'mage' ? .95 : .7, from: 'p', col: cls === 'mage' ? 0x9bb4ff : 0xb9f0c8, pierce: S.pierce, hit: new Set(), h: 1.3 });
    }
    sfx.shoot();
  }
}
function castSkill() {
  const P = G.P, S = P.S, cls = P.cls, sk = CLASSES[cls].skill;
  P.skillMax = sk.cd * (1 - S.cdr / 100); P.skillCd = P.skillMax; sfx.skill(); P.atkAnim = .3; P.faceT = .5;
  if (cls === 'warrior') {
    P.spin = .5; P.inv = Math.max(P.inv, .55);
    for (const e of G.cur.enemies) { if (e.dead || e.spawnT > 0) continue; const dx = e.x - P.x, dy = e.y - P.y, d = hyp(dx, dy); if (d < 5 + e.r) dealDamage(e, S.dmg * 2.2 * S.skillP, dx, dy, 16); }
    ringFx(P.x, P.y, 5, 0xffd28a, .35); G.shake = 6;
  } else if (cls === 'mage') {
    for (const e of G.cur.enemies) { if (e.dead || e.spawnT > 0) continue; const dx = e.x - P.x, dy = e.y - P.y, d = hyp(dx, dy); if (d < 8 + e.r) { dealDamage(e, S.dmg * 2.5 * S.skillP, dx, dy, 8); e.slow = 2.5; } }
    for (const b of bullets) if (b.from === 'e' && hyp(b.x - P.x, b.y - P.y) < 8) b.dead = true;
    ringFx(P.x, P.y, 8, 0x9bb4ff, .45); ringFx(P.x, P.y, 6, 0xd7b4ff, .35, .3); G.shake = 5;
  } else {
    const n = 9 + (S.proj - 1) * 2, base = Math.atan2(P.ay, P.ax), fan = 110 * Math.PI / 180;
    for (let i = 0; i < n; i++) {
      const a = base + (i / (n - 1) - .5) * fan;
      addBullet({ x: P.x + Math.cos(a) * .9, y: P.y + Math.sin(a) * .9, vx: Math.cos(a) * 24, vy: Math.sin(a) * 24, r: .24, dmg: S.dmg * 1.1 * S.skillP, life: .8, from: 'p', col: 0xb9f0c8, pierce: 1 + S.pierce, hit: new Set(), h: 1.3 });
    }
  }
}

/* ---- porte e stanze ---- */
function goRoom(nr, x, y) { const P = G.P; P.x = x; P.y = y; P.inv = Math.max(P.inv, .4); enterRoom(nr); }
function tryDoors() {
  const P = G.P, r = G.cur; if (!r.cleared) return;
  if (r.doors.n && P.y < .9) goRoom(r.doors.n, DCX, H - T * 1.5);
  else if (r.doors.s && P.y > H - .9) goRoom(r.doors.s, DCX, T * 1.5);
  else if (r.doors.e && P.x > W - .9) goRoom(r.doors.e, T * 1.5, DCY);
  else if (r.doors.w && P.x < .9) goRoom(r.doors.w, W - T * 1.5, DCY);
}
function clearRoom(room) {
  room.cleared = true; sfx.door(); updateDoorBars(room);
  if (room.type === 'boss') {
    dropLoot({ k: 'stairs', x: W / 2, y: H / 2 - 1 });
    dropLoot({ k: 'heart', x: W / 2 - 2.5, y: H / 2 + 2 });
    for (let i = 0; i < 3; i++) dropLoot({ k: 'item', x: W / 2 + (i - 1) * 3, y: H / 2 + 3.5, item: makeItem(slotRoll(), G.floor + 1, rollRarity(G.floor, G.P.S.luck + 50, 2), G.P.cls) });
    for (let i = 0; i < 8; i++) dropLoot({ k: 'coin', x: W / 2 + rnd(-4, 4), y: H / 2 + rnd(1, 4), val: irnd(2, 4) + G.floor });
    toast('Guardiano sconfitto! Prendi il bottino e scendi', '#ffd28a', 3200);
  } else if (Math.random() < .3) {
    dropLoot({ k: 'coin', x: W / 2 - .7, y: H / 2, val: irnd(1, 3) + Math.floor((G.floor - 1) / 2) }); dropLoot({ k: 'coin', x: W / 2 + .7, y: H / 2, val: irnd(1, 3) });
  }
}
function nextFloor() {
  sfx.stairs();
  if (G.floor === 5 && !G.won) {
    G.won = true; G.state = 'msg'; saveBest();
    showMsg({ title: 'VITTORIA', text: 'Hai sconfitto il Guardiano del quinto piano. Puoi continuare a scendere: i nemici saranno sempre più forti.', stats: summary(), btns: [{ t: 'Continua a scendere', fn: () => { G.floor++; clearBullets(); buildFloor(); G.state = 'play'; setView('none'); } }] });
    return;
  }
  G.floor++; buildFloor();
}
function summary() { const P = G.P; return [['Classe', CLASSES[P.cls].name], ['Livello', P.level], ['Piano', G.floor], ['Nemici sconfitti', G.kills], ['Monete', G.coins]]; }
function saveBest() {
  if (G.floor > best.floor || (G.floor === best.floor && G.P.level > best.level)) { best = { floor: G.floor, level: G.P.level }; store.set('mc3d_best', best); }
}
function die() {
  G.state = 'over'; saveBest();
  showMsg({ title: 'SEI CADUTO', text: 'La cripta ti ha inghiottito. Ogni discesa è diversa: cambia classe o riprova.', stats: summary().concat([['Record', 'piano ' + best.floor + ', liv. ' + best.level]]),
    btns: [{ t: 'Riprova', fn: () => newGame(G.cls) }, { t: 'Cambia classe', alt: 1, fn: showClassSelect }] });
}

/* =====================================================================
   9. AGGIORNAMENTO (logica di gioco)
   ===================================================================== */
function update(dt) {
  G.time += dt;
  const P = G.P, S = P.S, room = G.cur, k = input.keys;
  P.cd = Math.max(0, P.cd - dt); P.skillCd = Math.max(0, P.skillCd - dt); P.dashCd = Math.max(0, P.dashCd - dt);
  P.inv = Math.max(0, P.inv - dt); P.atkAnim = Math.max(0, P.atkAnim - dt); P.faceT = Math.max(0, P.faceT - dt); P.spin = Math.max(0, P.spin - dt);
  if (P.hurtT > 0) { P.hurtT -= dt; if (P.hurtT <= 0) setFlash(P, null); }
  if (S.regen > 0 && P.hp < S.maxHp) P.hp = Math.min(S.maxHp, P.hp + S.regen * dt);
  G.shake = Math.max(0, G.shake - dt * 28);

  let kx = 0, ky = 0;
  if (k.has('KeyA') || k.has('ArrowLeft')) kx--; if (k.has('KeyD') || k.has('ArrowRight')) kx++;
  if (k.has('KeyW') || k.has('ArrowUp')) ky--; if (k.has('KeyS') || k.has('ArrowDown')) ky++;
  let mx = kx, my = ky;
  if (hyp(input.stick.x, input.stick.y) > .2) { mx += input.stick.x; my += input.stick.y; }
  const ml = hyp(mx, my); if (ml > 1) { mx /= ml; my /= ml; }
  P.moving = ml > .15;
  if (P.moving) { P.fx = mx / (ml || 1); P.fy = my / (ml || 1); }

  if (input.dashPress && P.dashCd <= 0 && P.dash <= 0) {
    P.dash = .18; P.dashCd = .9; P.inv = Math.max(P.inv, .26);
    if (P.moving) { P.dx = mx / ml; P.dy = my / ml; } else { P.dx = P.fx; P.dy = P.fy; }
    sfx.dash(); spawnP(P.x, .4, P.y, 8, 0x9be7ff, 4);
  }
  input.dashPress = false;
  let vx, vy;
  if (P.dash > 0) { P.dash -= dt; vx = P.dx * 22; vy = P.dy * 22; } else { vx = mx * S.speed; vy = my * S.speed; }
  moveEnt(room, P, vx * dt, vy * dt);

  if (room.cleared) {
    const a = Math.min(1, dt * 14);
    if (my < -.3 && room.doors.n && P.y < T * 2.2 && Math.abs(P.x - DCX) < 1.6) P.x += (DCX - P.x) * a;
    if (my > .3 && room.doors.s && P.y > H - T * 2.2 && Math.abs(P.x - DCX) < 1.6) P.x += (DCX - P.x) * a;
    if (mx > .3 && room.doors.e && P.x > W - T * 2.2 && Math.abs(P.y - DCY) < 1.6) P.y += (DCY - P.y) * a;
    if (mx < -.3 && room.doors.w && P.x < T * 2.2 && Math.abs(P.y - DCY) < 1.6) P.y += (DCY - P.y) * a;
  }
  tryDoors(); if (G.cur !== room) return;

  computeAim();
  const want = input.mouse.down || k.has('Space') || k.has('KeyJ') || k.has('KeyZ') || input.atk;
  if (want && P.cd <= 0 && P.dash <= 0 && P.spin <= 0) playerAttack();
  if ((input.skill || k.has('KeyQ') || k.has('KeyE')) && P.skillCd <= 0 && P.dash <= 0) castSkill();
  input.skill = false;

  // proiettili
  for (const b of bullets) {
    b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
    if (b.life <= 0 || solidPx(room, b.x, b.y)) { b.dead = true; if (b.life > 0) spawnP(b.x, 1.2, b.y, 3, b.col, 3, .14); continue; }
    if (b.from === 'p') {
      for (const e of room.enemies) {
        if (e.dead || e.spawnT > 0 || b.hit.has(e)) continue;
        if (hyp(e.x - b.x, e.y - b.y) < e.r + b.r) {
          dealDamage(e, b.dmg, b.vx, b.vy, 5);
          if (b.pierce > 0) { b.pierce--; b.hit.add(e); } else { b.dead = true; break; }
        }
      }
    } else if (P.inv <= 0 && P.dash <= 0 && P.spin <= 0 && hyp(P.x - b.x, P.y - b.y) < P.r + b.r) { hurtPlayer(b.dmg, b.x, b.y); b.dead = true; }
    b.mesh.position.set(b.x, b.h, b.y);
  }
  for (let i = bullets.length - 1; i >= 0; i--) if (bullets[i].dead) { dyn.remove(bullets[i].mesh); bullets.splice(i, 1); }

  // nemici
  for (const e of room.enemies) updateEnemy(e, dt, room);
  const alive = room.enemies.filter(e => !e.dead);
  for (let i = 0; i < alive.length; i++) for (let j = i + 1; j < alive.length; j++) {
    const a = alive[i], b = alive[j];
    if (a.type === 'boss' || b.type === 'boss' || a.spawnT > 0 || b.spawnT > 0) continue;
    const dx = b.x - a.x, dy = b.y - a.y, d = hyp(dx, dy), min = a.cr + b.cr;
    if (d < min && d > .01) { const p = (min - d) / 2 / d; moveEnt(room, a, -dx * p, -dy * p); moveEnt(room, b, dx * p, dy * p); }
  }
  for (const e of alive) {
    if (e.dead || e.spawnT > 0 || !e.contact || e.hitCd > 0) continue;
    if (hyp(e.x - P.x, e.y - P.y) < e.r + P.r - .15) { hurtPlayer(e.dmg, e.x, e.y); if (P.inv > 0) e.hitCd = .8; }
  }
  room.enemies = room.enemies.filter(e => !e.dead);
  if (!room.cleared && room.spawned && room.enemies.length === 0) clearRoom(room);

  // loot a terra
  for (const l of room.loot) {
    l.t += dt;
    if (l.k !== 'stairs' && l.vh !== undefined) { l.vh -= 14 * dt; l.h += l.vh * dt; if (l.h < 0) { l.h = 0; l.vh = 0; } }
    const d = hyp(P.x - l.x, P.y - l.y);
    if (l.k === 'xp' && l.t > .35) { const s = 14 * dt; l.x += (P.x - l.x) / (d || 1) * Math.min(d, s * (1 + l.t)); l.y += (P.y - l.y) / (d || 1) * Math.min(d, s * (1 + l.t)); }
    if (l.k === 'coin' && d < 4.5) { l.x += (P.x - l.x) / d * 9 * dt; l.y += (P.y - l.y) / d * 9 * dt; }
    if (d < 1.1) {
      if (l.k === 'xp') { gainXp(l.val); removeLoot(l); }
      else if (l.k === 'coin') { G.coins += l.val; removeLoot(l); sfx.coin(); floatText(l.x, 1.6, l.y, '+' + l.val, '#ffd28a'); }
      else if (l.k === 'heart' && P.hp < P.S.maxHp) { heal(Math.round(P.S.maxHp * .3)); removeLoot(l); sfx.loot(); }
      else if (l.k === 'item' && l.t > .5) { removeLoot(l); sfx.loot(); addToBag(l.item); floatText(l.x, 2.2, l.y, l.item.name, RAR[l.item.rar].col); }
      else if (l.k === 'stairs') { nextFloor(); return; }
    }
  }
  room.loot = room.loot.filter(l => !l.dead);

  // piedistalli
  let near = null;
  for (const p of room.peds) {
    if (p.taken) continue;
    const d = hyp(P.x - p.x, P.y - p.y);
    if (d < 3.2 && (!near || d < near.d)) near = { p, d };
    if (d < 1.05) {
      if (p.cool > G.time) continue;
      if (G.coins < p.price) { p.cool = G.time + 1.5; sfx.deny(); floatText(p.x, 2.8, p.y, 'Servono ' + p.price + ' monete', '#ff8fa8'); continue; }
      if (p.kind === 'potion' && P.hp >= P.S.maxHp) { p.cool = G.time + 1.5; sfx.deny(); floatText(p.x, 2.8, p.y, 'Vita già piena', '#fff'); continue; }
      G.coins -= p.price; p.taken = true; dyn.remove(p.mesh);
      if (p.kind === 'potion') { heal(Math.round(P.S.maxHp * .5)); sfx.loot(); }
      else { addToBag(p.item); sfx.loot(); }
      if (p.group) for (const o of room.peds) if (o.group === p.group && !o.taken) { o.taken = true; dyn.remove(o.mesh); }
      spawnP(p.x, 1.2, p.y, 16, p.item ? RAR[p.item.rar].hex : 0xff4d6d, 6, .26);
    }
  }
  if (near && !near.p.taken) showTip(near.p.item, near.p.price, near.p.kind); else hideTip();

  if (P.pending > 0 && G.state === 'play') openLevelUp();
}

/* =====================================================================
   10. RENDER: sincronizza i modelli 3D con lo stato
   ===================================================================== */
function angDiff(a, b) { let d = b - a; while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI; return d; }
function updatePlayerModel(dt) {
  const P = G.P, m = P.model, h = m.h, t = G.time;
  const want = (P.faceT > 0 || !P.moving) ? Math.atan2(P.ax, P.ay) : Math.atan2(P.fx, P.fy);
  P.rot += angDiff(P.rot, want) * Math.min(1, dt * 14);
  m.root.position.set(P.x, 0, P.y);
  m.root.rotation.y = P.rot + (P.spin > 0 ? (.5 - P.spin) * Math.PI * 8 : 0);
  const sw = P.moving ? Math.sin(t * 12) * .8 : 0;
  h.legL.rotation.x = sw; h.legR.rotation.x = -sw;
  const base = P.cls === 'warrior' ? -.35 : P.cls === 'mage' ? -.5 : -.4;
  h.armL.rotation.x = P.cls === 'rogue' ? base - sw * .3 : -sw * .6;
  h.armR.rotation.x = base + (P.atkAnim > 0 ? -1.3 * (P.atkAnim / .22) : sw * .5);
  h.g.position.y = P.moving ? Math.abs(Math.sin(t * 12)) * .07 : Math.sin(t * 2) * .02;
  m.root.visible = !(P.inv > 0 && P.dash <= 0 && P.hurtT <= 0 && Math.floor(t * 22) % 2 === 0 && P.inv < .5);
  m.root.scale.setScalar(P.dash > 0 ? .9 : 1);
  torchL.position.set(P.x, 4.5, P.y);
}
function updateScene(dt) {
  const room = G.cur;
  updatePlayerModel(dt);
  for (const e of room.enemies) animEnemy(e, dt);
  for (const b of bullets) if (b.mesh) b.mesh.position.set(b.x, b.h, b.y);
  for (const l of room.loot) {
    if (!l.mesh) continue;
    l.mesh.position.set(l.x, l.k === 'stairs' ? 0 : (l.h || 0), l.y);
    const c = l.mesh.userData.core; if (c) { if (l.k === 'stairs') c.rotation.z = G.time; else c.rotation.y = G.time * 2.5; }
    if (l.k === 'item') l.mesh.children[0].rotation.y = G.time * 2;
  }
  for (const p of room.peds) { if (p.taken || !p.vis) continue; p.vis.position.y = .55 + Math.sin(G.time * 2 + p.x) * .12; if (p.vis.children[0]) p.vis.children[0].rotation.y = G.time * 2; }
  for (let i = 0; i < room.flames.length; i++) { const s = .24 + Math.sin(G.time * 12 + i * 2) * .04; room.flames[i].scale.set(s, .5 + Math.sin(G.time * 9 + i) * .1, s); }
}

/* =====================================================================
   11. INTERFACCIA: HUD, minimappa, pannelli
   ===================================================================== */
const HUDC = {};
function setTxt(id, v) { if (HUDC[id] !== v) { HUDC[id] = v; $(id).textContent = v; } }
const mmc = $('mm').getContext('2d');

  $('chipD').firstChild.style.width = (P.dashCd > 0 ? (1 - P.dashCd / .9) * 100 : 100) + '%';
  const boss = G.cur.enemies.find(e => e.type === 'boss'), bb = $('bossBar');
  if (boss) { bb.style.display = 'block'; setTxt('bossName', ENEMY_NAME.boss + ' · piano ' + G.floor); $('bossFill').style.width = clamp(boss.hp / boss.maxHp, 0, 1) * 100 + '%'; document.body.classList.add('boss'); }
  else { bb.style.display = 'none'; document.body.classList.remove('boss'); }
  // minimappa
  mmc.clearRect(0, 0, 60, 60);
  for (const r of G.rooms) {
    if (!r.seen) continue;
    const x = 4 + r.x * 10.4, y = 4 + r.y * 10.4;
    mmc.fillStyle = r === G.cur ? '#ffffff' : (r.visited ? '#8f84a8' : '#4b3d66'); mmc.fillRect(x, y, 8, 8);
    if (r.type !== 'normal' && r.type !== 'start') { mmc.fillStyle = '#' + DOOR_COL[r.type].toString(16).padStart(6, '0'); mmc.fillRect(x + 2, y + 2, 4, 4); }
  }
}

const ICON = {
  weapon: '<svg viewBox="0 0 24 24"><path d="M19 3l2 2-9 9-2-2zM9.2 12.8l2 2-2.3 2.3 1 1-1.4 1.4-2-2-2.3 2.3-1.4-1.4 2.3-2.3-2-2 1.4-1.4 1 1z"/></svg>',
  armor: '<svg viewBox="0 0 24 24"><path d="M12 2l8 3v7c0 5-3.5 8.5-8 10-4.5-1.5-8-5-8-10V5z"/></svg>',
  helm: '<svg viewBox="0 0 24 24"><path d="M3 15a9 9 0 0118 0v5h-5v-4h-8v4H3z"/></svg>',
  ring: '<svg viewBox="0 0 24 24"><path d="M12 2l3.5 4.5h-7zM12 8a7 7 0 100 14 7 7 0 000-14zm0 3a4 4 0 110 8 4 4 0 010-8z" fill-rule="evenodd"/></svg>'
};
let invSel = null;
function findItem(id) { const P = G.P; return P.bag.find(x => x.id === id) || SLOTS.map(s => P.equip[s]).find(x => x && x.id === id); }
function statLines(it, cmp) {
  const keys = Object.keys(it.stats); let h = '';
  for (const k of keys) {
    let dl = '';
    if (cmp) { const d = it.stats[k] - (cmp.stats[k] || 0); if (Math.abs(d) > .001) dl = '<i class="' + (d > 0 ? 'up' : 'dn') + '">' + (d > 0 ? '▲ ' : '▼ ') + (STAT[k].d ? n1(Math.abs(d)) : Math.round(Math.abs(d))) + '</i>'; }
    h += '<li><span>' + fmtStat(k, it.stats[k]) + ' ' + STAT[k].l + '</span>' + dl + '</li>';
  }
  if (cmp) for (const k of Object.keys(cmp.stats)) if (!(k in it.stats)) h += '<li class="neg"><span>−' + (STAT[k].d ? n1(cmp.stats[k]) : Math.round(cmp.stats[k])) + STAT[k].u + ' ' + STAT[k].l + '</span><i class="dn">▼</i></li>';
  return h;
}
function renderInv() {
  const P = G.P, S = P.S;
  const slotsH = SLOTS.map(sl => {
    const it = P.equip[sl];
    return '<button class="slot' + (it ? '' : ' empty') + (invSel === (it && it.id) && it ? ' sel' : '') + '" data-act="sel" data-id="' + (it ? it.id : '') + '" style="--rc:' + (it ? RAR[it.rar].col : '#4b3d66') + '">' + ICON[sl] + '<span>' + SLOT_NAME[sl] + '</span><em>' + (it ? it.name : 'vuoto') + '</em></button>';
  }).join('');
  let bagH = '';
  for (let i = 0; i < BAG_MAX; i++) {
    const it = P.bag[i];
    bagH += it ? '<button class="it' + (invSel === it.id ? ' sel' : '') + '" data-act="sel" data-id="' + it.id + '" style="--rc:' + RAR[it.rar].col + '" aria-label="' + it.name + '">' + ICON[it.slot] + (it.isNew ? '<u></u>' : '') + '<small>' + it.ilvl + '</small></button>' : '<div class="it empty"></div>';
  }
  const sel = invSel ? findItem(invSel) : null;
  let det = '<div class="box"><small>Seleziona un oggetto per vedere i dettagli.</small></div>';
  if (sel) {
    const inBag = P.bag.includes(sel), cmp = inBag ? P.equip[sel.slot] : null;
    det = '<div class="box" style="--rc:' + RAR[sel.rar].col + '"><h4>' + sel.name + '</h4><small>' + SLOT_NAME[sel.slot] + ' · livello ' + sel.ilvl + ' · ' + RAR[sel.rar].n + (inBag ? '' : ' · equipaggiato') + '</small><ul>' + statLines(sel, cmp) + '</ul>' +
      (inBag ? '<div class="btns" style="justify-content:flex-start"><button class="btn sm" data-act="equip" data-id="' + sel.id + '">Equipaggia</button><button class="btn sm alt" data-act="sell" data-id="' + sel.id + '">Vendi (+' + sel.sell + ')</button></div>' : '') + '</div>';
  }
  const st = [
    ['Danno', n1(S.dmg)], ['Attacchi al secondo', n1(1 / S.delay)], ['Critico', Math.round(S.crit) + '%'], ['Danno critico', Math.round(S.critD) + '%'],
    ['Vita massima', S.maxHp], ['Armatura', S.armor + ' (−' + Math.round(S.red * 100) + '% danni)'], ['Velocità', n1(S.speed)],
    ['Vampirismo', n1(S.steal) + '%'], ['Rigenerazione', n1(S.regen) + '/s'], ['Ricarica abilità', Math.round(S.cdr) + '%'], ['Esperienza', '+' + Math.round(S.xp) + '%'], ['Fortuna', '+' + Math.round(S.luck) + '%']
  ].map(r => '<span>' + r[0] + '</span><span>' + r[1] + '</span>').join('');
  $('pInv').innerHTML = '<header><h2>' + CLASSES[P.cls].name + ' · Livello ' + P.level + ' · ' + G.coins + ' monete</h2><button class="btn sm alt" data-act="close">Chiudi (I)</button></header>' +
    '<div class="invbody"><div class="invcol"><div class="slots">' + slotsH + '</div><div class="box"><div class="sgrid">' + st + '</div></div></div>' +
    '<div class="invcol"><div class="box" style="padding:6px 8px"><small style="margin:0 0 4px">Zaino ' + P.bag.length + '/' + BAG_MAX + '</small><div class="bag">' + bagH + '</div></div>' +
    (P.bag.some(x => x.rar === 0) ? '<button class="btn sm alt" data-act="sellc" style="align-self:flex-start">Vendi tutti i comuni</button>' : '') + det + '</div></div>';
}
function openInv() {
  if (G.state !== 'play') return;
  G.state = 'inv'; invSel = null; input.keys.clear(); input.atk = false; input.mouse.down = false; hideTip();
  renderInv(); setView('inv');
}
function closeInv() {
  if (G.state !== 'inv') return;
  for (const it of G.P.bag) it.isNew = false; recountNew();
  G.state = 'play'; setView('none');
}
$('pInv').addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, id = Number(b.dataset.id);
  if (act === 'close') closeInv();
  else if (act === 'sel') { if (b.dataset.id) { invSel = id; const it = findItem(id); if (it) it.isNew = false; recountNew(); } renderInv(); }
  else if (act === 'equip') { equipItem(id); invSel = id; renderInv(); }
  else if (act === 'sell') { sellItem(id); invSel = null; renderInv(); }
  else if (act === 'sellc') { for (const it of G.P.bag.filter(x => x.rar === 0)) sellItem(it.id); invSel = null; renderInv(); }
});

function showMsg(o) {
  $('mTitle').textContent = o.title; $('mText').textContent = o.text || '';
  const st = $('mStats'); st.textContent = '';
  (o.stats || []).forEach(([k, v]) => { const a = document.createElement('span'), b = document.createElement('span'); a.textContent = k; b.textContent = v; st.append(a, b); });
  const bt = $('mBtns'); bt.textContent = '';
  (o.btns || []).forEach(b => { const x = document.createElement('button'); x.className = 'btn' + (b.alt ? ' alt' : ''); x.type = 'button'; x.textContent = b.t; x.addEventListener('click', () => { ensureAudio(); b.fn(); }); bt.appendChild(x); });
  msgFirst = o.btns && o.btns[0] ? o.btns[0].fn : null;
  setView('msg');
  setTimeout(() => { const f = bt.firstChild; if (f) f.focus({ preventScroll: true }); }, 30);
}
let msgFirst = null;
function showClassSelect() {
  if (G) G.state = 'menu';
  $('classCards').innerHTML = Object.values(CLASSES).map(c => {
    const b = c.base;
    return '<button class="card" data-cls="' + c.id + '" style="--cc:' + c.color + '"><h3>' + c.name + '</h3><span class="role">' + c.role + '</span>' +
      '<dl><dt>Vita</dt><dd>' + b.hp + '</dd><dt>Danno</dt><dd>' + n1(b.dmg) + '</dd><dt>Attacchi/s</dt><dd>' + n1(1 / b.delay) + '</dd><dt>Velocità</dt><dd>' + n1(b.speed) + '</dd><dt>Armatura</dt><dd>' + b.armor + '</dd></dl>' +
      '<p><b>Attacco:</b> ' + c.atk + '</p><p><b>' + c.skill.name + ':</b> ' + c.skill.desc + '</p></button>';
  }).join('');
  $('recTxt').textContent = best.floor ? 'Record: piano ' + best.floor + ', livello ' + best.level : 'Nessun record ancora: la prima discesa ti aspetta.';
  setView('class');
}
$('classCards').addEventListener('click', e => { const b = e.target.closest('[data-cls]'); if (!b) return; ensureAudio(); newGame(b.dataset.cls); });
$('lvCards').addEventListener('click', e => { const b = e.target.closest('[data-i]'); if (b) { ensureAudio(); pickUpgrade(Number(b.dataset.i)); } });

function togglePause() {
  if (!G) return;
  if (G.state === 'play') {
    G.state = 'pause'; input.keys.clear(); input.atk = false; input.mouse.down = false; hideTip();
    showMsg({ title: 'PAUSA', text: '', stats: summary(), btns: [{ t: 'Riprendi', fn: togglePause }, { t: 'Zaino', alt: 1, fn: () => { G.state = 'play'; setView('none'); openInv(); } }] });
  } else if (G.state === 'pause') { G.state = 'play'; setView('none'); }
}
function toggleMute() { muted = !muted; store.set('mc3d_muted', muted); ensureAudio(); $('bSnd').textContent = muted ? 'Muto' : 'Suono'; if (!muted) sfx.coin(); }
$('bSnd').textContent = muted ? 'Muto' : 'Suono';
$('bInv').addEventListener('click', () => { ensureAudio(); if (G.state === 'inv') closeInv(); else openInv(); });
$('bPause').addEventListener('click', () => { ensureAudio(); togglePause(); });
$('bSnd').addEventListener('click', toggleMute);

/* =====================================================================
   12. INPUT
   ===================================================================== */
const GAME_KEYS = ['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Tab'];
window.addEventListener('keydown', e => {
  ensureAudio();
  if (GAME_KEYS.includes(e.code)) e.preventDefault();
  if (!G) return;
  const st = G.state;
  if (st === 'inv') { if (e.code === 'KeyI' || e.code === 'Tab' || e.code === 'Escape') closeInv(); return; }
  if (st === 'levelup') { const n = ['Digit1', 'Digit2', 'Digit3'].indexOf(e.code); if (n >= 0) pickUpgrade(n); return; }
  if (st === 'pause') { if (e.code === 'KeyP' || e.code === 'Escape') togglePause(); else if (e.code === 'Enter' && msgFirst) msgFirst(); return; }
  if (st === 'over' || st === 'msg') { if (e.code === 'Enter' && msgFirst) msgFirst(); return; }
  if (st !== 'play') return;
  if (e.repeat && ['KeyP', 'Escape', 'KeyM', 'KeyI', 'Tab'].includes(e.code)) return;
  input.keys.add(e.code);
  if (['ShiftLeft', 'ShiftRight', 'KeyK', 'KeyX'].includes(e.code)) input.dashPress = true;
  if (e.code === 'KeyP' || e.code === 'Escape') togglePause();
  if (e.code === 'KeyI' || e.code === 'Tab') openInv();
  if (e.code === 'KeyM') toggleMute();
});
window.addEventListener('keyup', e => input.keys.delete(e.code));
window.addEventListener('blur', () => { input.keys.clear(); input.atk = false; input.mouse.down = false; if (G && G.state === 'play') togglePause(); });
document.addEventListener('visibilitychange', () => { if (document.hidden && G && G.state === 'play') togglePause(); });
document.addEventListener('contextmenu', e => e.preventDefault());

function setMouse(e) {
  const r = cv.getBoundingClientRect();
  input.mouse.nx = ((e.clientX - r.left) / r.width) * 2 - 1; input.mouse.ny = -((e.clientY - r.top) / r.height) * 2 + 1; input.mouse.t = performance.now();
}
cv.addEventListener('pointerdown', e => { ensureAudio(); if (e.pointerType === 'mouse' && e.button === 0) { setMouse(e); input.mouse.down = true; } });
cv.addEventListener('pointermove', e => { if (e.pointerType === 'mouse') setMouse(e); });
window.addEventListener('pointerup', e => { if (e.pointerType === 'mouse') input.mouse.down = false; });

const stick = $('stick'), knob = $('knob'); let stickId = null;
function stickMove(e) {
  const r = stick.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  let dx = e.clientX - cx, dy = e.clientY - cy; const m = r.width * .36, d = hyp(dx, dy);
  if (d > m) { dx *= m / d; dy *= m / d; }
  input.stick.x = dx / m; input.stick.y = dy / m; knob.style.transform = 'translate(' + dx + 'px,' + dy + 'px)';
}
function stickEnd(e) { if (e.pointerId !== stickId) return; stickId = null; input.stick.x = 0; input.stick.y = 0; knob.style.transform = ''; }
stick.addEventListener('pointerdown', e => { ensureAudio(); stickId = e.pointerId; stick.setPointerCapture(e.pointerId); stickMove(e); e.preventDefault(); });
stick.addEventListener('pointermove', e => { if (e.pointerId === stickId) stickMove(e); });
stick.addEventListener('pointerup', stickEnd); stick.addEventListener('pointercancel', stickEnd);

const btnA = $('btnA'), btnS = $('btnS'), btnD = $('btnD'), atkIds = new Set();
btnA.addEventListener('pointerdown', e => { ensureAudio(); atkIds.add(e.pointerId); btnA.setPointerCapture(e.pointerId); input.atk = true; btnA.classList.add('on'); e.preventDefault(); });
const atkEnd = e => { atkIds.delete(e.pointerId); if (!atkIds.size) { input.atk = false; btnA.classList.remove('on'); } };
btnA.addEventListener('pointerup', atkEnd); btnA.addEventListener('pointercancel', atkEnd);
btnS.addEventListener('pointerdown', e => { ensureAudio(); input.skill = true; btnS.classList.add('on'); e.preventDefault(); });
btnS.addEventListener('pointerup', () => btnS.classList.remove('on')); btnS.addEventListener('pointercancel', () => btnS.classList.remove('on'));
btnD.addEventListener('pointerdown', e => { ensureAudio(); input.dashPress = true; btnD.classList.add('on'); e.preventDefault(); });
btnD.addEventListener('pointerup', () => btnD.classList.remove('on')); btnD.addEventListener('pointercancel', () => btnD.classList.remove('on'));

/* =====================================================================
   13. AVVIO E CICLO PRINCIPALE
   ===================================================================== */
newGame('warrior');          // stanza dimostrativa dietro al menu
G.state = 'menu';
showClassSelect();
let last = performance.now();
function frame(now) {
  const dt = Math.min(.033, (now - last) / 1000); last = now;
  if (G.state === 'play') update(dt);
  else if (G.state === 'menu') G.time += dt;
  updateScene(dt);
  if (G.state !== 'menu') updateHUD();
  if (toastT > 0) { toastT -= dt; if (toastT <= 0) toastEl.classList.remove('show'); }
  updateFx(dt); updateTexts(dt); updateCamera(dt);
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
if (document.fonts && document.fonts.load) document.fonts.load('600 14px "Pixelify Sans"');
})();
</script>
</body>
